<body>

  <div class="container">
    <div class="header">
      <div>
        <h1>BTW calculator</h1>
        <p>Bereken bedragen exclusief en inclusief BTW met instelbaar percentage.</p>
      </div>
      <div class="nav">
        <a class="badge" href="../index.html">Home</a>
        <a class="badge" href="../disclaimer.html">Disclaimer</a>
        <a class="badge" href="../privacy.html">Privacy</a>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Calculator</h2>
        <div class="content">
          <form id="calcForm" novalidate>
            <div class="row">
              <div>
                <label for="amount">Bedrag (€)</label>
                <input id="amount" type="number" value="100" step="0.01" min="0">
              </div>
              <div>
                <label for="vat">BTW %</label>
                <input id="vat" type="number" value="21" step="0.01" min="0">
              </div>
            </div>

            <div class="row">
              <div>
                <label for="mode">Bereken</label>
                <select id="mode">
                  <option value="add">Excl → Incl</option>
                  <option value="remove">Incl → Excl</option>
                </select>
              </div>
            </div>

            <div class="actions">
              <button class="primary" type="submit">Bereken</button>
              <button type="button" id="resetBtn">Reset</button>
            </div>
          </form>

          <div class="result" id="result" aria-live="polite">
            <strong>Resultaat</strong>
            <div id="resultText">Vul waarden in en klik op “Bereken”.</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Uitleg</h2>
        <div class="content">
          <p>Deze calculator berekent hoeveel BTW in een bedrag zit of wat het bedrag inclusief BTW is.</p>
        </div>
      </div>
    </div>


  </div>

  <script>
    (function () {
      const form = document.getElementById("calcForm");
      const resetBtn = document.getElementById("resetBtn");
      const resultText = document.getElementById("resultText");

      function calc(amount, vatPct, mode) {
        const rate = vatPct / 100;
        if (mode === "add") {
          const vat = amount * rate;
          return { excl: amount, vat: vat, incl: amount + vat };
        } else {
          const excl = amount / (1 + rate);
          return { excl: excl, vat: amount - excl, incl: amount };
        }
      }

      form.addEventListener("submit", e => {
        e.preventDefault();

        const amount = parseFloat(document.getElementById("amount").value);
        const vat = parseFloat(document.getElementById("vat").value);
        const mode = document.getElementById("mode").value;

        if (!Number.isFinite(amount) || !Number.isFinite(vat)) {
          resultText.textContent = "Vul geldige getallen in.";
          return;
        }

        const r = calc(amount, vat, mode);

        resultText.innerHTML =
          "Excl: €" + r.excl.toFixed(2) + "<br>" +
          "BTW: €" + r.vat.toFixed(2) + "<br>" +
          "Incl: €" + r.incl.toFixed(2);
      });

      resetBtn.addEventListener("click", () => {
        document.getElementById("amount").value = 100;
        document.getElementById("vat").value = 21;
        resultText.textContent = "Vul waarden in en klik op “Bereken”.";
      });
    })();
  </script>

</body>

</html>
